<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }} · {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description | strip_newlines }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151719'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='52' fill='%23ff8a5c' text-anchor='middle'%3EDS%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <script>
    // Applied before first paint so the correct theme never flashes.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a class="nav-name" href="{{ '/' | relative_url }}">David Schmotz</a>
      <div class="nav-links">
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#about">About</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" width="17" height="17">
            <circle cx="12" cy="12" r="4.2"/>
            <g stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" width="17" height="17">
            <path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container" id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <span class="footer-dot">·</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('theme-toggle');
      toggle.addEventListener('click', function () {
        var current = root.getAttribute('data-theme');
        if (!current) {
          current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });

      var nav = document.getElementById('nav');
      var onScroll = function () {
        nav.classList.toggle('scrolled', window.scrollY > 8);
      };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
</body>
</html>
