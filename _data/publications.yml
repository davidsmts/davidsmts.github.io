- title: "Decoding Encrypted Reasoning Traces in Proprietary LLM APIs"
  authors: "Alexander Panfilov*, David Schmotz*, Ilia Shumailov, Luca Beurer-Kellner, Ameya Prabhu, Jonas Geiping, Maksym Andriushchenko"
  year: 2026
  venue: "Preprint"
  status: "In preparation"
  summary: >-
    Providers hide chain-of-thought behind opaque encrypted blobs, but those blobs
    are portable across sessions, users and models. We replay a captured trace into
    a weaker compatible model and make it transcribe the hidden reasoning verbatim —
    recovering a strong model's chain-of-thought without ever attacking it directly.
  note: >-
    A preliminary scan of publicly posted agent traces recovered 61 API keys,
    36 passwords and 32 personal emails from encrypted reasoning fields.
  tags:
    - Reasoning traces
    - Privacy
    - Model extraction
  links: []
